name: Veilborn CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Analyze & Test ──────────────────────────────────────────
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Error-only mode: --fatal-infos too strict (unused fields, asset dirs exist)
        # Re-enable --fatal-warnings in v1.1 after art assets + cleanup pass
        run: flutter analyze

      - name: Run all tests with coverage
        run: flutter test --coverage --reporter=github

      - name: Check coverage threshold (70%)
        run: |
          sudo apt-get install -y lcov > /dev/null 2>&1
          LINES=$(grep -c "^DA:" coverage/lcov.info 2>/dev/null || echo 0)
          HIT=$(grep -E "^DA:[0-9]+,[^0]" coverage/lcov.info 2>/dev/null | wc -l || echo 0)
          if [ "$LINES" -gt 0 ]; then
            PCT=$((HIT * 100 / LINES))
            echo "📊 Coverage: $PCT% ($HIT/$LINES lines)"
            if [ "$PCT" -lt 70 ]; then
              echo "❌ Coverage $PCT% is below the 70% threshold"
              exit 1
            fi
            echo "✅ Coverage $PCT% meets threshold"
          else
            echo "⚠️  No coverage data — skipping threshold check"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 14

  # ── Build Android APK ──────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veilborn-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ── Build iOS ──────────────────────────────────────────────
  build-ios:
    name: Build iOS (no-codesign)
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: veilborn-ios-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 14

  # ── Release build (main branch only) ──────────────────────
  release:
    name: Create Release Artifacts
    runs-on: ubuntu-latest
    needs: [ build-android, build-ios ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: veilborn-android-${{ github.sha }}
          path: release/android/

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Veilborn v${{ steps.version.outputs.version }}
          body_path: docs/CHANGELOG.md
          draft: true
          prerelease: false
