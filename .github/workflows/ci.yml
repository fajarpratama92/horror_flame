name: Veilborn CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Analyze & Test ──────────────────────────────────────────
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # --fatal-infos removed until all asset dirs exist (Phase 7)
        # --fatal-warnings removed until Phase 5/6 unused fields are wired up
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          LINES=$(grep -E "^DA:" coverage/lcov.info | wc -l)
          HIT=$(grep -E "^DA:[0-9]+,[^0]" coverage/lcov.info | wc -l)
          if [ "$LINES" -gt 0 ]; then
            PCT=$((HIT * 100 / LINES))
            echo "Coverage: $PCT%"
            if [ "$PCT" -lt 70 ]; then
              echo "❌ Coverage $PCT% is below 70% threshold"
              exit 1
            fi
            echo "✅ Coverage $PCT% meets threshold"
          else
            echo "⚠️  No coverage data found — skipping threshold check"
          fi

  # ── Build Android ──────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: veilborn-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ── Build iOS ──────────────────────────────────────────────
  build-ios:
    name: Build iOS (no-codesign)
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: veilborn-ios-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 7
