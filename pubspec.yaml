name: horror_flame
description: Veilborn — A dark fantasy action RPG platformer survival game.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Game engine
  flame: ^1.18.0
  flame_tiled: ^1.20.0
  flame_riverpod: ^5.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local save
  shared_preferences: ^2.2.3

  # IAP
  in_app_purchase: ^3.1.13

  # Audio
  flame_audio: ^2.10.0

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  # Linting
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  # Asset pipeline — Phase 9
  # Directories exist with .gitkeep placeholders.
  # Replace placeholders with real assets when art/audio are ready.
  assets:
    # Player sprite sheets
    - assets/images/player/

    # Enemy sprite sheets
    - assets/images/enemies/
    - assets/images/enemies/bosses/

    # UI / HUD elements
    - assets/images/ui/

    # Parallax background layers
    - assets/images/backgrounds/

    # Tiled map files (.tmx) and tilesets (.tsx)
    - assets/tiles/chapter1/
    - assets/tiles/chapter2/

    # Sound effects
    - assets/audio/sfx/

    # Background music
    - assets/audio/music/

  # Custom fonts — commented out until real .ttf files are provided.
  # Drop VeilbornDisplay.ttf and VeilbornBody.ttf into assets/fonts/
  # then uncomment this block. See docs/ASSET_GUIDE.md for specs.
  #
  # fonts:
  #   - family: VeilbornDisplay
  #     fonts:
  #       - asset: assets/fonts/VeilbornDisplay.ttf
  #   - family: VeilbornBody
  #     fonts:
  #       - asset: assets/fonts/VeilbornBody.ttf
